name: Rebuild AMD with Moodle Grunt

on: [push]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Rebuild AMD with Moodle Grunt'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Moodle
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: MOODLE_405_STABLE
          path: moodle

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          ref: master
          path: moodle/mod/percentage
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: moodle/.nvmrc

      - name: Install Moodle build dependencies
        working-directory: moodle
        run: npm ci

      - name: Build plugin AMD modules
        working-directory: moodle
        run: npx grunt amd --root=mod/percentage

      - name: Commit generated AMD build
        working-directory: moodle/mod/percentage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amd/build
          if git diff --cached --quiet; then
            echo "AMD build is already current."
            exit 0
          fi
          git commit -m "Build AMD with Moodle Grunt"
          git push origin HEAD:master
